name: VinAI Queue Worker

run-name: VinAI Queue Worker (${{ inputs.model || 'gpt-oss-20b' }})

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model yang dimuat untuk sesi worker ini"
        required: true
        type: choice
        default: gpt-oss-20b
        options:
          - gpt-oss-20b
          - qwen-3b
      reasoning:
        description: "Reasoning GPT-OSS"
        required: true
        type: choice
        default: medium
        options:
          - low
          - medium
          - high

permissions:
  contents: write

concurrency:
  group: vinai-queue-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout queue branch
        uses: actions/checkout@v4
        with:
          ref: feature/gpt-oss-20b-terminal
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/chromium
          df -h /

      - name: Build llama.cpp server once
        run: |
          set -e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON
          cmake --build llama.cpp/build --config Release --target llama-server -j2
          mkdir -p /tmp/llama-bin
          cp llama.cpp/build/bin/llama-server /tmp/llama-bin/
          rm -rf llama.cpp
          df -h /

      - name: Download model once
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -e
          python -m pip install --disable-pip-version-check --no-cache-dir huggingface_hub
          mkdir -p model
          if [ "$MODEL" = "gpt-oss-20b" ]; then
            hf download ggml-org/gpt-oss-20b-GGUF gpt-oss-20b-MXFP4.gguf --local-dir model
            echo "MODEL_PATH=model/gpt-oss-20b-MXFP4.gguf" >> "$GITHUB_ENV"
          else
            hf download bartowski/Qwen2.5-Coder-3B-Instruct-GGUF Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf --local-dir model
            echo "MODEL_PATH=model/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf" >> "$GITHUB_ENV"
          fi
          df -h /

      - name: Start model server and process queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUEUE_BRANCH: feature/gpt-oss-20b-terminal
          MODEL: ${{ inputs.model }}
          REASONING: ${{ inputs.reasoning }}
        run: |
          set -e
          SERVER_ARGS=()
          if [ "$MODEL" = "gpt-oss-20b" ]; then
            SERVER_ARGS+=(--jinja --chat-template-kwargs "{\"reasoning_effort\":\"$REASONING\"}")
          else
            SERVER_ARGS+=(--jinja)
          fi
          /tmp/llama-bin/llama-server \
            --model "$MODEL_PATH" \
            "${SERVER_ARGS[@]}" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 4096 \
            > /tmp/vinai-server.log 2>&1 &
          echo $! > /tmp/vinai-server.pid
          python -m pip install --disable-pip-version-check --no-cache-dir requests
          python worker.py
